name: CI · Main Push · Release

# Repo-local: every merge to main becomes a tag and a GitHub Release, so
# callers can pin to @vX.Y.Z. The bump comes from the head branch of the
# merged pull request: major/ → major, feature/ or features/ → minor,
# anything else → patch.

on:
  push:
    branches:
      - main
  # Escape hatch for a merge that did not start this workflow (one made with
  # GITHUB_TOKEN). Runs only on main, see the `if:` of the jobs below.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release half way, between the tag and the release:
# queue the next merge behind it instead.
concurrency:
  group: ci-main-github-workflows
  cancel-in-progress: false

jobs:
  lint:
    name: Run actionlint
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 .
          ./actionlint -color

  determine_version:
    name: Detect version bump
    needs:
      - lint
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/workflow-determine-version-bump.yml
    with:
      target-branch: main
      major-branch-prefixes: |
        major/
      minor-branch-prefixes: |
        feature/
        features/
      patch-branch-prefixes: |
        fix/
        fixes/
      default: patch

  calculate_tag:
    name: Compute next tag
    needs:
      - determine_version
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-compute-next-tag.yml
    with:
      version-bump: ${{ needs.determine_version.outputs['version-bump'] }}

  create_tag:
    name: Create git tag
    needs:
      - calculate_tag
    permissions:
      contents: write
    uses: ./.github/workflows/workflow-create-tag.yml
    with:
      sha: ${{ github.sha }}
      next-tag: ${{ needs.calculate_tag.outputs['new-tag'] }}
      previous-tag: ${{ needs.calculate_tag.outputs['previous-tag'] }}
    secrets:
      gh_token: ${{ secrets.TOKEN }}

  create_release:
    name: Publish release
    needs:
      - create_tag
    if: ${{ needs.create_tag.outputs.created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/workflow-create-release.yml
    with:
      tag-name: ${{ needs.create_tag.outputs['new-tag'] }}
      previous-tag: ${{ needs.create_tag.outputs['previous-tag'] }}
      merged-prs: "[]"
