name: Create Tag

on:
  workflow_call:
    inputs:
      target-branch:
        description: "Branch to fetch before creating the tag."
        required: false
        default: main
        type: string
      version-bump:
        description: "Which part of the semver should be incremented (major/minor/patch)."
        required: true
        type: string
    secrets:
      gh_token:
        description: "Token passed from caller (defaults to the built-in GITHUB_TOKEN)."
        required: false
    outputs:
      new-tag:
        description: "Tag string that was created."
        value: ${{ jobs.create-tag.outputs.new-tag }}
      previous-tag:
        description: "Previous tag that was used as the base."
        value: ${{ jobs.create-tag.outputs.previous-tag }}

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new-tag: ${{ steps.create.outputs.new_tag }}
      previous-tag: ${{ steps.create.outputs.previous_tag }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target-branch }}

      - name: Create and push tag
        id: create
        env:
          VERSION_BUMP_INPUT: ${{ inputs.version-bump }}
          TARGET_BRANCH_INPUT: ${{ inputs.target-branch }}
          GH_TOKEN: ${{ secrets.gh_token != '' && secrets.gh_token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          version_bump="${VERSION_BUMP_INPUT,,}"
          case "$version_bump" in
            major|minor|patch) ;;
            *)
              echo "Unsupported version bump '$version_bump'."
              exit 1
              ;;
          esac

          git fetch origin "$TARGET_BRANCH_INPUT" --tags
          git checkout "$TARGET_BRANCH_INPUT"
          git pull origin "$TARGET_BRANCH_INPUT"

          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi
          previous_tag="$latest_tag"
          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<<"$version"
          major=${major:-0}
          minor=${minor:-0}
          patch=${patch:-0}

          case "$version_bump" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          new_tag="v${major}.${minor}.${patch}"
          echo "Creating tag $new_tag (previous tag $previous_tag)."
          git tag -a "$new_tag" -m "Automated $version_bump release"
          git push origin "$new_tag"

          {
            echo "new_tag=$new_tag"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"
