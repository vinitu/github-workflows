name: Release new version

on:
  workflow_run:
    workflows: ["Auto Merge PRs"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: read

jobs:
  determine-version:
    uses: ./.github/workflows/workflow-determine-version-bump.yml
    with:
      target-branch: main
      major-branch-prefixes: |
        major/
      minor-branch-prefixes: |
        feature/
        features/
      patch-branch-prefixes: |
        fix/
        fixes/
      default: patch
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  create-tag:
    needs: determine-version
    uses: ./.github/workflows/workflow-create-tag.yml
    with:
      target-branch: main
      version-bump: ${{ needs.determine-version.outputs.version-bump }}
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    needs:
      - determine-version
      - create-tag
    uses: ./.github/workflows/workflow-create-release.yml
    with:
      tag-name: ${{ needs.create-tag.outputs.new-tag }}
      previous-tag: ${{ needs.create-tag.outputs.previous-tag }}
      merged-prs: '[]'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
