name: CI · PR Lint · Merge

# Repo-local: lint every workflow, then merge the pull request. This
# workflow never tags: ci-main.yml tags and releases on the push to main
# that the merge produces. Tagging here would tag the previous commit,
# because `gh pr merge --auto` returns before GitHub has merged.
#
# The merge uses the TOKEN secret (a personal access token). A merge made
# with the built-in GITHUB_TOKEN starts no `on: push` workflow, so
# ci-main.yml would never run.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Run actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 .
          ./actionlint -color

  # The direct-merge fallback in workflow-merge-pull-requests.yml is safe
  # here only because this job needs lint: it runs after the checks passed.
  merge_prs:
    name: Merge PR
    needs:
      - lint
    if: ${{ github.event.pull_request.draft == false }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/workflow-merge-pull-requests.yml
    with:
      target-branch: main
      merge-method: squash
      pull-requests: ${{ toJson(github.event.pull_request) }}
    secrets:
      gh_token: ${{ secrets.TOKEN }}
