name: Compute Next Tag

# Finds the newest release tag of the form vX.Y.Z and applies the bump.
# Pre-release tags such as v1.7.0-alpha are ignored on purpose: an
# unanchored glob matches them, and bash then reads "0-alpha" as 0.

on:
  workflow_call:
    inputs:
      target-branch:
        description: "Deprecated and ignored. Tags are read from the whole repository through the GitHub API."
        required: false
        default: main
        type: string
      version-bump:
        description: "Which part of the semver should be incremented (major/minor/patch)."
        required: true
        type: string
    secrets:
      gh_token:
        description: "Token for the GitHub API (defaults to the built-in GITHUB_TOKEN)."
        required: false
    outputs:
      new-tag:
        description: "Next tag derived from the newest vX.Y.Z tag and the selected bump."
        value: ${{ jobs.calculate.outputs.new-tag }}
      previous-tag:
        description: "Newest vX.Y.Z tag used as the base, or v0.0.0 when there is none."
        value: ${{ jobs.calculate.outputs.previous-tag }}

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      new-tag: ${{ steps.compute.outputs.new_tag }}
      previous-tag: ${{ steps.compute.outputs.previous_tag }}
    steps:
      - name: Compute next tag
        id: compute
        env:
          GH_TOKEN: ${{ secrets.gh_token || github.token }}
          VERSION_BUMP_INPUT: ${{ inputs.version-bump }}
        run: |
          set -euo pipefail

          version_bump="${VERSION_BUMP_INPUT,,}"
          case "$version_bump" in
            major|minor|patch) ;;
            *)
              echo "::error::version-bump must be major, minor or patch, got '$version_bump'"
              exit 1
              ;;
          esac

          # Read the tags in a command of their own, so an API failure stops
          # the job instead of looking like "no tags" and restarting at v0.0.1.
          # matching-refs returns [] when the repository has no tags at all.
          tags=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" \
            --jq '.[].ref | sub("^refs/tags/"; "")')
          previous_tag=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$tags" | sort -V | tail -n1 || true)
          if [ -z "$previous_tag" ]; then
            previous_tag="v0.0.0"
          fi

          IFS='.' read -r major minor patch <<<"${previous_tag#v}"
          # 10# reads "08" as eight, not as a broken octal number.
          major=$((10#$major)); minor=$((10#$minor)); patch=$((10#$patch))
          case "$version_bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new_tag="v${major}.${minor}.${patch}"

          echo "Previous tag: ${previous_tag}. Next tag: ${new_tag}."
          {
            echo "new_tag=${new_tag}"
            echo "previous_tag=${previous_tag}"
          } >> "$GITHUB_OUTPUT"
