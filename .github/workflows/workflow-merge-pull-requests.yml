name: Merge Pull Requests

# Merges same-repo pull requests into the target branch. It first asks for
# GitHub's auto-merge (`--auto`), which merges later, once the required
# checks pass. When the repository does not allow auto-merge it merges
# directly instead.
#
# The direct merge does not wait for any check. Call this workflow only from
# a job that `needs:` the jobs that must be green, in the same workflow run.
#
# `merged` is true only when the pull request really is merged at the end of
# the run. A pull request that is only queued for auto-merge reports
# `auto-merge-enabled`, and the merge happens after this run ends: never tag
# or release from `merged` in the same run. Tag on the push to the target
# branch instead (see ci-main.yml).
#
# Pass a personal access token in `gh_token`. A merge made with the built-in
# GITHUB_TOKEN starts no `on: push` workflow on the target branch.

on:
  workflow_call:
    inputs:
      target-branch:
        description: "Only merge pull requests targeting this branch."
        required: false
        default: main
        type: string
      merge-method:
        description: "Merge strategy to use (merge/squash/rebase)."
        required: false
        default: merge
        type: string
      pull-requests:
        description: "PR payload (object or array) to use when event is workflow_call."
        required: false
        default: ""
        type: string
    secrets:
      gh_token:
        description: "Token passed from caller (defaults to the built-in GITHUB_TOKEN)."
        required: false
    outputs:
      merged:
        description: "true only when at least one pull request is really merged by the end of this run. Enabling auto-merge alone does not count."
        value: ${{ jobs.merge.outputs.merged }}
      auto-merge-enabled:
        description: "true when at least one pull request is left open with auto-merge enabled; GitHub merges it after this run."
        value: ${{ jobs.merge.outputs.auto-merge-enabled }}
      merged-prs:
        description: "JSON array with metadata (number/title/author/head) of the pull requests that are really merged."
        value: ${{ jobs.merge.outputs.merged-prs }}

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      auto-merge-enabled: ${{ steps.merge.outputs.auto_merge_enabled }}
      merged-prs: ${{ steps.merge.outputs.merged_prs }}
    steps:
      - name: Merge pull requests targeting branch
        id: merge
        env:
          GH_TOKEN: ${{ secrets.gh_token != '' && secrets.gh_token || secrets.GITHUB_TOKEN }}
          TARGET_BRANCH_INPUT: ${{ inputs.target-branch }}
          MERGE_METHOD_INPUT: ${{ inputs.merge-method }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          PULL_REQUESTS_INPUT: ${{ inputs.pull-requests }}
        run: |
          set -euo pipefail

          target_branch="${TARGET_BRANCH_INPUT:-main}"
          merge_method="${MERGE_METHOD_INPUT:-merge}"
          case "$merge_method" in
            squash|rebase|merge) ;;
            *) merge_method="merge" ;;
          esac
          case "$merge_method" in
            squash) merge_flag="--squash" ;;
            rebase) merge_flag="--rebase" ;;
            *) merge_flag="--merge" ;;
          esac
          merged_any="false"
          auto_enabled_any="false"
          merged_entries=()

          event_name="${EVENT_NAME:-workflow_run}"
          prs_input="${PULL_REQUESTS_INPUT:-}"
          PRS=""

          if [ -n "$prs_input" ]; then
            PRS=$(jq -c 'if type=="array" then .[] else . end' <<<"$prs_input" 2>/dev/null || true)
          fi

          if [ -z "$PRS" ]; then
            if [ "$event_name" = "pull_request" ]; then
              PRS=$(jq -c '{number:.pull_request.number, base:{ref:.pull_request.base.ref}, head:{ref:.pull_request.head.ref, repo:{full_name:.pull_request.head.repo.full_name}}}' "$GITHUB_EVENT_PATH")
            else
              PRS=$(jq -c '.workflow_run.pull_requests[]?' "$GITHUB_EVENT_PATH")
            fi
          fi
          if [ -z "$PRS" ]; then
            echo "No pull requests associated with this workflow run."
          fi

          while IFS= read -r pr; do
            [ -z "$pr" ] && continue
            number=$(jq -r '.number' <<<"$pr")
            base=$(jq -r '.base.ref' <<<"$pr")
            head=$(jq -r '.head.ref' <<<"$pr")
            head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr")
            head_lower="${head,,}"

            if [ "$base" != "$target_branch" ]; then
              echo "Skipping PR #$number because base branch is $base (target $target_branch)."
              continue
            fi

            if [ -n "$head_repo" ] && [ "$head_repo" != "$BASE_REPO" ]; then
              echo "Skipping PR #$number because it originates from fork $head_repo."
              continue
            fi

            state=$(gh pr view "$number" -R "$REPO" --json state --jq '.state')
            if [ "$state" != "OPEN" ]; then
              echo "PR #$number is $state; nothing to merge."
              continue
            fi

            is_draft=$(gh pr view "$number" -R "$REPO" --json isDraft --jq '.isDraft')
            if [ "$is_draft" = "true" ]; then
              echo "Skipping PR #$number because it is a draft."
              continue
            fi

            if [[ "$head_lower" == wip* || "$head_lower" == */wip* ]]; then
              echo "Skipping PR #$number because head branch is marked WIP ($head)."
              continue
            fi

            pr_meta=$(gh pr view "$number" -R "$REPO" --json title,author --jq '.title + "::" + (.author.login // "")' 2>/dev/null || echo "")
            title="${pr_meta%%::*}"
            author="${pr_meta##*::}"
            if [ -z "$title" ] || [ "$title" = "null" ]; then
              title="Pull request #${number}"
            fi
            if [ -z "$author" ] || [ "$author" = "null" ]; then
              author="${GITHUB_ACTOR:-bot}"
            fi

            echo "Merging PR #$number with method $merge_method..."
            # Prefer auto-merge (waits for required checks). Repos without the
            # auto-merge feature (e.g. private repos on plans that lack it) reject
            # --auto; fall back to a direct merge, which is safe here because this
            # job runs after CI, so the required checks are already green.
            merge_err=$(mktemp)
            if ! gh pr merge "$number" -R "$REPO" "$merge_flag" --auto --delete-branch --body "Merged automatically after successful CI." 2>"$merge_err"; then
              if grep -qi "auto merge is not allowed" "$merge_err"; then
                echo "Auto-merge is disabled on $REPO; performing a direct merge instead."
                gh pr merge "$number" -R "$REPO" "$merge_flag" --delete-branch --body "Merged automatically after successful CI."
              else
                cat "$merge_err" >&2
                rm -f "$merge_err"
                exit 1
              fi
            fi
            rm -f "$merge_err"

            # `gh pr merge --auto` returns as soon as auto-merge is enabled,
            # before GitHub merges. Read the real state before reporting.
            after=$(gh pr view "$number" -R "$REPO" --json state,autoMergeRequest \
              --jq '.state + " " + (if .autoMergeRequest == null then "false" else "true" end)')
            after_state="${after%% *}"
            after_auto="${after##* }"
            if [ "$after_state" = "MERGED" ]; then
              echo "::notice title=PR merged::PR #${number} is merged."
              merged_any="true"
              entry=$(jq -n --arg number "$number" --arg head "$head" --arg title "$title" --arg author "$author" '{number:$number,head:$head,title:$title,author:$author}')
              merged_entries+=("$entry")
            elif [ "$after_auto" = "true" ]; then
              echo "::notice title=Auto-merge enabled::PR #${number} merges once its required checks pass; it is not merged yet."
              auto_enabled_any="true"
            else
              echo "::warning title=PR not merged::PR #${number} is ${after_state} without auto-merge after the merge call."
            fi
          done <<<"$PRS"

          if [ "$merged_any" = "true" ]; then
            merged_json=$(printf '%s\n' "${merged_entries[@]}" | jq -s '.')
          else
            merged_json='[]'
          fi

          {
            echo "merged=$merged_any"
            echo "auto_merge_enabled=$auto_enabled_any"
            echo "merged_prs<<EOF"
            printf '%s\n' "$merged_json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
